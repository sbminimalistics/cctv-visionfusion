syntax = "proto3";

package cctv_vf;

import "google/protobuf/timestamp.proto";

// Go module namespace
option go_package = "/downloads";

message DownloadInstruction {
    google.protobuf.Timestamp event_time = 1;
    string token = 2;
    google.protobuf.Timestamp token_expiry = 3;
    string redeem_path = 4;
}