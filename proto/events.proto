syntax = "proto3";

package cctv_vf;

import "google/protobuf/timestamp.proto";

// Ensures Go generates files into their specific absolute module namespaces
option go_package = "/events";

message DeviceEvent {
    string uuid = 1;
    string device_id = 2;
    google.protobuf.Timestamp event_time = 3;
    string manufacturer = 4;
    string event_type = 5;
    bytes raw_payload = 6;
}

message CompositionEvent {
    string uuid = 1;
    string id = 2;
    repeated CompositionSource sources = 3;
    google.protobuf.Timestamp event_time = 4;
}

message CompositionSource {
    string device_id = 1;
    string event_type = 2;
}
