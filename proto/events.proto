syntax = "proto3";

package cctv_vf;

import "google/protobuf/timestamp.proto";
import "detections.proto";

// Go module namespace
option go_package = "sbminimalistics.com/cctv-visionfusion/proto/events";

message Detection {
    repeated cctv_vf.DetectedObject detections = 1;
    cctv_vf.FrameMetadata frame = 2;
}

message DeviceEvent {
    string uuid = 1;
    string device_id = 2;
    google.protobuf.Timestamp event_time = 3;
    string manufacturer = 4;
    string event_type = 5;
    optional Detection detection = 6; 
}

message CompositeEvent {
    string uuid = 1;
    string id = 2;
    repeated CompositeEventSource sources = 3;
    google.protobuf.Timestamp event_time = 4;
}

message CompositeEventSource {
    string device_id = 1;
    string event_type = 2;
}
