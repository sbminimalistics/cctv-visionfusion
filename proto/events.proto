syntax = "proto3";

package cctv_vf;

import "google/protobuf/timestamp.proto";

// Go module namespace
option go_package = "/events";

message DeviceEvent {
    string uuid = 1;
    string device_id = 2;
    google.protobuf.Timestamp event_time = 3;
    string manufacturer = 4;
    string event_type = 5;
}

message CompositeEvent {
    string uuid = 1;
    string id = 2;
    repeated CompositeEventSource sources = 3;
    google.protobuf.Timestamp event_time = 4;
}

message CompositeEventSource {
    string device_id = 1;
    string event_type = 2;
}
