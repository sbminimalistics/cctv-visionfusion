syntax = "proto3";

package cctv_vf;

import "google/protobuf/timestamp.proto";

// Ensures Go generates files into their specific absolute module namespaces
option go_package = "/events";

message DeviceEvent {
    string device_id = 1;
    google.protobuf.Timestamp event_time = 2;
    string manufacturer = 3;
    string event_type = 4;
    bytes raw_payload = 5;
}

message CompositionEvent {
    string id = 1;
    repeated CompositionSource sources = 2;
    google.protobuf.Timestamp event_time = 3;
}

message CompositionSource {
    string device_id = 1;
    string event_type = 2;
}
