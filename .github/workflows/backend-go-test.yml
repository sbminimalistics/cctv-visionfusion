name: backend Go Test

on:
  push:
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend-go-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/backend/go.mod'

      - name: Run tests
        working-directory: services/backend
        run: go test -v ./...
