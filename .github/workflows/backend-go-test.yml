name: backend Go Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/tools/go@v5
        with:
          go-version-file: 'go.mod' # Automatically matches your go.mod version

      - name: Run tests
        working-directory: services/backend
        run: go test -v ./...
