edge_devices:
    - id: "unique-device-id"
      protocol: "http"
      host: "0.0.0.0"
      port: 80
      user: "api_user_placeholder"
      password: "secure_password_placeholder"
      manufacturer: "hikvision"
      device_type: "camera"
      picture_path: "/ISAPI/Streaming/channels/101/picture"

event_compositions:
    - id: "composition_000"
      default_event_retention_ms: 1000
      sources:
          - device_id: "unique-device-id"
            event_type: "VMD"

routing:
    - source:
          source_id: "unique-device-id"
          event_type_regexp: "*"
      destination_exchange: "exchange_topic"
    - source:
          source_id: "composition_000"
          event_type_regexp: "*"
      destination_exchange: "exchange_topic"

database:
    host: "localhost"
    port: 5432
    name: "cctv-vf_production"
    user: "db_user_placeholder"
    password: "" # inject via DB_PASSWORD environment variable

rabbitmq:
    host: "localhost"
    port: 5672
    user: "producer_worker"
    password: "" # inject via RMQ_PASS environment variable
    vhost: "/cctv-vf"
